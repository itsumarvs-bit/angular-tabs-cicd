name: AngularTabs CI-CD Pipeline

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  continuous-integration:
    name: Continuous Integration
    runs-on: windows-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Ionic Angular application
        run: npm run build

  continuous-deployment:
    name: Continuous Deployment
    needs: continuous-integration
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Verify Docker
        shell: powershell
        run: docker info

      - name: Build Docker image
        shell: powershell
        run: docker build -t ionic-firestore-crud:latest .

      - name: Remove previous container
        shell: powershell
        run: |
          $existing = docker ps -aq -f "name=^ionic-firestore-crud-container$"
          if ($existing) {
            docker rm -f ionic-firestore-crud-container
          } else {
            Write-Host "No previous container to remove."
          }

      - name: Start updated container
        shell: powershell
        run: |
          docker run -d --name ionic-firestore-crud-container --restart unless-stopped -p 8100:8100 ionic-firestore-crud:latest
          if ($LASTEXITCODE -ne 0) {
            exit 1
          }

      - name: Verify application
        shell: powershell
        run: |
          $success = $false
          for ($i = 1; $i -le 15; $i++) {
            try {
              Invoke-WebRequest http://localhost:8100/ -UseBasicParsing -TimeoutSec 2 | Out-Null
              $success = $true
              break
            }
            catch {
              Start-Sleep -Seconds 2
            }
          }

          if (-not $success) {
            docker logs ionic-firestore-crud-container
            exit 1
          }

          Write-Host "AngularTabs application deployed successfully!"
